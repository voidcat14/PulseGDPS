services:
  mysql:
    image: mysql:8.4
    profiles: [mysql]
    environment:
      MYSQL_DATABASE: geometrydash
      MYSQL_USER: gdps
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: change-root-password
    ports: ["3306:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
  postgres:
    image: postgres:16
    profiles: [postgres]
    environment:
      POSTGRES_DB: geometrydash
      POSTGRES_USER: gdps
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
volumes:
  mysql-data:
  postgres-data:
